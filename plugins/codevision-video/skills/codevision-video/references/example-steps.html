<template id="steps-template">
  <div data-composition-id="steps" data-width="1920" data-height="1080">
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
      [data-composition-id="steps"] { position: absolute; inset: 0; font-family: "Pretendard", sans-serif; color: #0b1a3a; letter-spacing: -0.02em; }
      [data-composition-id="steps"] .head { position: absolute; left: 96px; top: 56px; display: flex; gap: 14px; align-items: center; }
      [data-composition-id="steps"] .head .step { background: #002387; color: #fff; font-size: 26px; font-weight: 700; padding: 10px 22px; border-radius: 999px; }
      [data-composition-id="steps"] .head .label { font-size: 30px; font-weight: 700; }
      [data-composition-id="steps"] .count { position: absolute; right: 96px; top: 44px; font-size: 64px; font-weight: 800; color: #002387; font-variant-numeric: tabular-nums; }
      [data-composition-id="steps"] .count small { font-size: 32px; color: #8a94ab; font-weight: 700; }
      [data-composition-id="steps"] .grid { position: absolute; left: 96px; right: 96px; top: 140px; bottom: 150px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 18px; }
      [data-composition-id="steps"] .group { background: #fff; border: 1px solid #d9dfeb; border-radius: 24px; padding: 18px 28px; }
      [data-composition-id="steps"] .group h3 { font-size: 27px; font-weight: 800; color: #002387; margin-bottom: 6px; }
      [data-composition-id="steps"] .group li { list-style: none; font-size: 21px; font-weight: 500; color: #4a5670; padding: 3px 0; display: flex; align-items: center; gap: 10px; }
      [data-composition-id="steps"] .group li i { width: 22px; height: 22px; border-radius: 50%; background: #e3e9f8; flex: none; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 14px; font-weight: 800; color: #fff; }
    </style>
    <div class="head"><span class="step">3단계</span><span class="label">설치 명령이 하는 일</span></div>
    <div class="count"><span id="steps-n">0</span><small> / 35</small></div>
    <div class="grid" id="steps-grid"></div>
    <script>
      const groups = [
        ["준비", ["공정 선택", "호스트명", "기본 패키지", "SSH 서버", "한글 입력기"]],
        ["절전 모드 해제", ["화면 꺼짐·잠금", "서스펜드·덮개", "Wi-Fi 절전", "PCIe·USB·NVMe 커널 인자", "SSD·NPU·GPU·NIC"]],
        ["프로그램", ["Chrome", "Chrome 첫 실행 설정", "VS Code"]],
        ["자동 업데이트 해제", ["apt 자동 업데이트", "snap 자동 갱신", "업데이트 알림", "업그레이드·광고 안내", "Chrome 저장소 갱신"]],
        ["현장 운영", ["시간대 Asia/Seoul", "자동 로그인", "암호 없는 키 모음"]],
        ["실행 환경", ["Docker", "docker·render 그룹", "uv"]],
        ["원격·백업·화면", ["RustDesk", "Synology Drive Client", "왼쪽 독 아이콘", "부팅 화면·바탕화면 로고"]],
        ["드라이버", ["드라이버 반입", "Intel NPU 드라이버", "Intel iGPU 런타임", "Hikrobot MVS", "커널 고정", "카메라 NIC"]],
        ["검사 프로그램", ["플랫폼 설치 (covi setup)"]],
      ];
      const grid = document.getElementById("steps-grid");
      groups.forEach(([title, items]) => {
        const g = document.createElement("div");
        g.className = "group";
        g.innerHTML = `<h3>${title}</h3><ul>${items.map((t) => `<li><i>✓</i>${t}</li>`).join("")}</ul>`;
        grid.appendChild(g);
      });

      const tl = gsap.timeline({ paused: true });
      const counter = { n: 0 };
      const n = document.getElementById("steps-n");
      tl.from("#steps-grid .group", { opacity: 0, y: 24, duration: 0.4, stagger: 0.12, ease: "power2.out" }, 0);
      const items = grid.querySelectorAll("li");
      const per = 9.5 / items.length;
      items.forEach((li, i) => {
        const at = 1.2 + i * per;
        tl.fromTo(li.querySelector("i"), { scale: 0.6, backgroundColor: "#e3e9f8" }, { scale: 1, backgroundColor: "#12a150", duration: 0.25, ease: "back.out(3)" }, at);
        tl.fromTo(li, { color: "#8a94ab" }, { color: "#0b1a3a", duration: 0.2 }, at);
      });
      tl.to(counter, { n: 35, duration: 9.5, ease: "none", onUpdate: () => (n.textContent = Math.round(counter.n)) }, 1.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["steps"] = tl;
    </script>
  </div>
</template>
