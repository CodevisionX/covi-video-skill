<template id="steps-template">
  <div data-composition-id="steps" data-width="1920" data-height="1080">
    <style>
      @font-face { font-family: "Pretendard"; font-weight: 500; src: url("assets/fonts/Pretendard-Medium.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 700; src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2"); }
      @font-face { font-family: "Pretendard"; font-weight: 800; src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
      [data-composition-id="steps"] { position: absolute; inset: 0; font-family: "Pretendard", sans-serif; color: #0b1a3a; letter-spacing: -0.02em; }
      [data-composition-id="steps"] .head { position: absolute; left: 96px; top: 56px; display: flex; gap: 14px; align-items: center; }
      [data-composition-id="steps"] .head .step { background: #002387; color: #fff; font-size: 30px; font-weight: 700; padding: 10px 24px; border-radius: 999px; }
      [data-composition-id="steps"] .head .label { font-size: 30px; font-weight: 700; }
      [data-composition-id="steps"] .count { position: absolute; right: 96px; top: 44px; font-size: 64px; font-weight: 800; color: #002387; font-variant-numeric: tabular-nums; }
      [data-composition-id="steps"] .count small { font-size: 32px; color: #4a5670; font-weight: 700; }
      [data-composition-id="steps"] .rail { position: absolute; left: 96px; top: 160px; width: 600px; list-style: none; }
      [data-composition-id="steps"] .rail li { height: 76px; display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 800; color: #4a5670; }
      [data-composition-id="steps"] .rail i { width: 18px; height: 18px; border: 2px solid #002387; flex: none; }
      [data-composition-id="steps"] .panel { position: absolute; left: 740px; right: 96px; top: 160px; height: 684px; background: #fff; border: 1px solid #d9dfeb; border-radius: 22px; box-shadow: 0 6px 16px rgba(11, 26, 58, 0.12); padding: 44px 64px; opacity: 0; }
      [data-composition-id="steps"] .panel.first { opacity: 1; }
      [data-composition-id="steps"] .panel h3 { font-size: 44px; font-weight: 800; color: #002387; margin-bottom: 28px; }
      [data-composition-id="steps"] .panel li { list-style: none; font-size: 36px; font-weight: 500; color: #4a5670; padding: 13px 0; display: flex; align-items: center; gap: 20px; }
      [data-composition-id="steps"] .panel svg { width: 36px; height: 36px; flex: none; fill: none; stroke: #d9dfeb; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <div class="head"><span class="step">3단계</span><span class="label">설치 명령이 하는 일</span></div>
    <div class="count"><span id="steps-n">0</span><small> / 35</small></div>
    <ul class="rail" id="steps-rail"></ul>
    <div id="steps-panels"></div>
    <script>
      const groups = [
        ["준비", ["공정 선택", "호스트명", "기본 패키지", "SSH 서버", "한글 입력기"]],
        ["절전 모드 해제", ["화면 꺼짐·잠금", "서스펜드·덮개", "Wi-Fi 절전", "PCIe·USB·NVMe 커널 인자", "SSD·NPU·GPU·NIC"]],
        ["프로그램", ["Chrome", "Chrome 첫 실행 설정", "VS Code"]],
        ["자동 업데이트 해제", ["apt 자동 업데이트", "snap 자동 갱신", "업데이트 알림", "업그레이드·광고 안내", "Chrome 저장소 갱신"]],
        ["현장 운영", ["시간대 Asia/Seoul", "자동 로그인", "암호 없는 키 모음"]],
        ["실행 환경", ["Docker", "docker·render 그룹", "uv"]],
        ["원격·백업·화면", ["RustDesk", "Synology Drive Client", "왼쪽 독 아이콘", "부팅 화면·바탕화면 로고"]],
        ["드라이버", ["드라이버 반입", "Intel NPU 드라이버", "Intel iGPU 런타임", "Hikrobot MVS", "커널 고정", "카메라 NIC"]],
        ["검사 프로그램", ["플랫폼 설치 (covi setup)"]],
      ];
      const rail = document.getElementById("steps-rail");
      const panels = document.getElementById("steps-panels");
      const check = '<svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 6"/></svg>';
      groups.forEach(([title, items], i) => {
        rail.insertAdjacentHTML("beforeend", `<li><i></i>${title}</li>`);
        panels.insertAdjacentHTML("beforeend", `<div class="panel${i ? "" : " first"}"><h3>${title}</h3><ul>${items.map((t) => `<li>${check}${t}</li>`).join("")}</ul></div>`);
      });

      const tl = gsap.timeline({ paused: true });
      const counter = { n: 0 };
      const n = document.getElementById("steps-n");
      const total = groups.reduce((sum, [, items]) => sum + items.length, 0);
      const per = 9.5 / total;
      const rows = rail.querySelectorAll("li");
      const sheets = panels.querySelectorAll(".panel");
      tl.from(rows, { opacity: 0, duration: 0.25, stagger: 0.08, ease: "expo.out" }, 0);
      let at = 1.2;
      groups.forEach(([, items], g) => {
        if (g) {
          tl.set(sheets[g - 1], { opacity: 0 }, at);
          tl.set(sheets[g], { opacity: 1 }, at);
          tl.set(rows[g - 1], { color: "#4a5670" }, at);
        }
        tl.set(rows[g], { color: "#002387" }, at);
        tl.set(rows[g].querySelector("i"), { backgroundColor: "#002387" }, at);
        sheets[g].querySelectorAll("li").forEach((li) => {
          tl.to(li.querySelector("svg"), { stroke: "#12a150", duration: 0.15, ease: "expo.out" }, at);
          tl.to(li, { color: "#0b1a3a", duration: 0.15, ease: "expo.out" }, at);
          at += per;
        });
      });
      tl.to(counter, { n: total, duration: 9.5, ease: "none", onUpdate: () => (n.textContent = Math.round(counter.n)) }, 1.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["steps"] = tl;
    </script>
  </div>
</template>
